name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow (release.yml, D-017) runs this whole file with a version, so a release
  # ships exactly what these jobs built and tested.
  workflow_call:
    inputs:
      version:
        description: Release version stamped into the build (empty for normal CI)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release never cancels, or is
  # cancelled by, the push CI run on the same branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (core, CLI, fixture integration)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Dovecot for the fixture servers
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dovecot-imapd python3 openssl >/dev/null
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-build-${{ hashFiles('Package.resolved', 'Package.swift') }}
      - name: Build
        run: swift build --build-tests
      - name: Start fixture servers
        run: python3 Fixtures/slopfixture.py up --dir /tmp/slopfx
      - name: Test
        env:
          SLOP_FIXTURE_DIR: /tmp/slopfx
          SLOP_REQUIRE_FIXTURES: "1"
        run: swift test
      - name: CLI smoke test against the fixture
        env:
          SLOP_BRIDGE_PASSWORD: fixture-bridge-password
        run: |
          PORT=$(python3 -c "import json;print(json.load(open('/tmp/slopfx/bridge.json'))['port'])")
          swift run slop-export probe --user fixture@example.test --port "$PORT" --cert /tmp/slopfx/bridge/cert.pem
          swift run slop-export export --user fixture@example.test --port "$PORT" --cert /tmp/slopfx/bridge/cert.pem --out /tmp/slop-cli-export
          swift run slop-export mbox --export /tmp/slop-cli-export --out /tmp/slop-cli-mbox
      - name: CLI upload smoke test against the iCloud fixture
        env:
          SLOP_ICLOUD_PASSWORD: fixture-icloud-password
        run: |
          PORT=$(python3 -c "import json;print(json.load(open('/tmp/slopfx/icloud.json'))['port'])")
          ARGS="--export /tmp/slop-cli-export --user fixture-9@icloud.example.test --host 127.0.0.1 --port $PORT --pin-cert /tmp/slopfx/icloud/cert.pem"
          swift run slop-export upload $ARGS
          swift run slop-export upload $ARGS --write
          swift run slop-export upload $ARGS | tee /tmp/second.txt
          grep -q "Total: 0 messages" /tmp/second.txt
      - name: CLI verify smoke test (Bridge, export, mbox and iCloud fixtures)
        env:
          SLOP_BRIDGE_PASSWORD: fixture-bridge-password
          SLOP_ICLOUD_PASSWORD: fixture-icloud-password
        run: |
          BPORT=$(python3 -c "import json;print(json.load(open('/tmp/slopfx/bridge.json'))['port'])")
          IPORT=$(python3 -c "import json;print(json.load(open('/tmp/slopfx/icloud.json'))['port'])")
          swift run slop-export verify --export /tmp/slop-cli-export --mbox /tmp/slop-cli-mbox \
            --bridge-user fixture@example.test --bridge-port "$BPORT" --bridge-cert /tmp/slopfx/bridge/cert.pem \
            --icloud-user fixture-9@icloud.example.test --icloud-host 127.0.0.1 --icloud-port "$IPORT" \
            --icloud-pin-cert /tmp/slopfx/icloud/cert.pem --html /tmp/verify.html
          grep -q "Passed" /tmp/verify.html
      - name: Fixture server logs
        if: failure()
        run: tail -n 100 /tmp/slopfx/*/dovecot.log || true

  linux-app:
    name: Linux app (GTK, keyring, GUI end-to-end)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          path: slop-export  # the Linux package refers to the root package by this folder name
      - name: Install GTK, libsecret, the fixtures and a headless desktop
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libgtk-3-dev libsecret-1-dev dovecot-imapd python3 openssl xvfb xdotool imagemagick \
            dbus dbus-x11 gnome-keyring libsecret-tools at-spi2-core adwaita-icon-theme fonts-dejavu-core >/dev/null
      - uses: actions/cache@v4
        with:
          path: slop-export/Linux/.build
          key: linux-app-build-${{ hashFiles('slop-export/Linux/Package.resolved', 'slop-export/Linux/Package.swift') }}
      - name: Build
        working-directory: slop-export
        run: swift build --package-path Linux --build-tests
      - name: Start fixture servers
        working-directory: slop-export
        run: python3 Fixtures/slopfixture.py up --dir /tmp/slopfx
      - name: Test (with a real keyring in a private D-Bus session)
        working-directory: slop-export
        env:
          SLOP_FIXTURE_DIR: /tmp/slopfx
          SLOP_REQUIRE_FIXTURES: "1"
          SLOP_TEST_KEYRING: "1"
        run: |
          dbus-run-session -- sh -ec 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            swift test --package-path Linux'
      - name: Drive the GTK app through all five steps
        working-directory: slop-export
        run: scripts/linux-gui-e2e.sh "$(swift build --package-path Linux --show-bin-path)/slop-export-gtk" /tmp/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-app-screenshots
          path: /tmp/screenshots
          if-no-files-found: ignore
      - name: Fixture server logs
        if: failure()
        run: tail -n 100 /tmp/slopfx/*/dovecot.log || true

  linux-deb:
    name: Linux package (.deb, built on Ubuntu 22.04)
    runs-on: ubuntu-24.04
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          path: slop-export
      - name: Install GTK and libsecret headers
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libgtk-3-dev libsecret-1-dev dpkg-dev >/dev/null
      - name: Stamp the release version
        working-directory: slop-export
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/set-version.sh "$VERSION"
      - name: Build and package
        working-directory: slop-export
        run: scripts/package-deb.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: slop-export-deb
          path: slop-export/dist/*

  linux-deb-install:
    name: Install the .deb on ${{ matrix.image }} and run it
    needs: linux-deb
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: slop-export-deb
          path: dist
      - name: Install the package (no Swift on this machine)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./dist/slop-export_*.deb >/dev/null
          slop-export-gtk --version
      - name: Check the package carries the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dpkg-query -W -f '${Version}\n' slop-export | grep -qx "$VERSION"
          slop-export-gtk --version | grep -qx "slop-export-gtk $VERSION"
      - name: Install the fixtures and a headless desktop
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            dovecot-imapd python3 openssl xvfb xdotool imagemagick dbus dbus-x11 gnome-keyring libsecret-tools at-spi2-core >/dev/null
      - name: Drive the installed app through all five steps
        run: scripts/linux-gui-e2e.sh /usr/bin/slop-export-gtk /tmp/screenshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deb-install-failure-${{ strategy.job-index }}
          path: /tmp/screenshots
          if-no-files-found: ignore

  macos:
    name: macOS (app, UI tests, package)
    runs-on: macos-15
    defaults:
      run:
        shell: bash  # adds -o pipefail, so a failed xcodebuild piped into xcbeautify fails the step
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Stamp the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/set-version.sh "$VERSION"
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging
      - name: Core unit tests
        run: swift test
      - name: Generate Xcode project
        run: cd App && xcodegen generate
      - name: Build universal app
        run: |
          xcodebuild -project App/SlopExport.xcodeproj -scheme SlopExport -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO build | xcbeautify
      - name: UI tests
        run: |
          xcodebuild -project App/SlopExport.xcodeproj -scheme SlopExport -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build-tests test | xcbeautify
      - name: Check the app is universal and sandboxed
        run: |
          APP=build/Build/Products/Release/SlopExport.app
          lipo -archs "$APP/Contents/MacOS/SlopExport" | tee /dev/stderr | grep -q "x86_64 arm64"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "com.apple.security.app-sandbox"
      - name: Check the app carries the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PLIST=build/Build/Products/Release/SlopExport.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" | tee /dev/stderr | grep -qx "$VERSION"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" | tee /dev/stderr | grep -qx "$VERSION"
      - name: Package
        run: scripts/package-app.sh build/Build/Products/Release/SlopExport.app dist
      - uses: actions/upload-artifact@v4
        with:
          name: SlopExport-app
          path: dist/*
